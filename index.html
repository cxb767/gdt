                    <button onClick={()=>setMtForm(f=>({...f,prep:f.prep.filter((_,xi)=>xi!==pi)}))} style={{background:'transparent',border:'none',color:C.txt3,fontSize:14,cursor:'pointer'}}>✕</button>
                  </div>
                ))}
              </div>
            </div>
            <div style={{padding:'9px 14px',borderTop:`1px solid ${C.g4}`,display:'flex',gap:6,justifyContent:'flex-end',background:C.bg2,position:'sticky',bottom:0}}>
              <button onClick={()=>setShowMTM(false)} style={s.btn(false)}>취소</button>
              <button onClick={saveMT} style={s.btn(true)}>💾 저장</button>
            </div>
          </div>
        </div>
      )}

      {/* ══════════ 사진으로 대원 인식 (OCR) ══════════ */}
      {showOcr && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:520,display:'flex',alignItems:isMobile?'flex-end':'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderTop:`3px solid ${C.gold}`,width:isMobile?'100%':480,maxWidth:'96vw',maxHeight:isMobile?'92vh':'92vh',overflowY:'auto'}}>
            <div style={{background:C.bg2,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.g4}`,position:'sticky',top:0}}>
              <div style={{fontSize:14,fontWeight:900,color:C.gold}}>📷 사진으로 대원 인식</div>
              <button onClick={()=>{setShowOcr(false);setOcrImage(null);setOcrText('');setOcrPreview([]);}} style={{background:'transparent',border:'none',color:C.txt3,fontSize:20,cursor:'pointer'}}>✕</button>
            </div>
            <div style={{padding:14,display:'flex',flexDirection:'column',gap:10}}>
              <div style={{fontSize:10,color:C.txt3,lineHeight:1.6}}>
                인쇄된 표·명부 사진을 인식합니다. 처리는 전부 이 브라우저 안에서만 이뤄지고 사진이 외부로 전송되지 않습니다. 인식률을 높이려면 이름·연차·역종·전화번호·주소 사이 간격을 넓게 찍힌 표가 좋습니다.
              </div>

              <input type="file" accept="image/*" capture="environment" onChange={handleOcrFile} style={s.input}/>

              {ocrImage && (
                <img src={ocrImage} alt="선택된 이미지" style={{maxWidth:'100%',maxHeight:200,objectFit:'contain',border:`1px solid ${C.g4}`}}/>
              )}

              {ocrImage && !ocrText && (
                <button onClick={runOcr} disabled={ocrRunning} style={{...s.btn(true),width:'100%'}}>
                  {ocrRunning ? `🔍 인식 중... ${ocrProgress}%` : '🔍 텍스트 인식 시작'}
                </button>
              )}

              {ocrText && (
                <>
                  <div style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>인식된 텍스트 (틀린 부분 직접 수정 가능)</div>
                  <textarea value={ocrText} onChange={e=>setOcrText(e.target.value)}
                    style={{width:'100%',minHeight:120,background:C.bg2,border:`1px solid ${C.g4}`,color:C.txt,fontFamily:fontMono,fontSize:11,padding:8,resize:'vertical',outline:'none',lineHeight:1.6}}/>
                  <div style={{fontSize:9,color:C.txt3}}>한 줄 = 대원 한 명, 항목 사이는 쉼표(,) 또는 띄어쓰기 2칸 이상으로 구분하면 잘 나뉩니다. (이름, 연차, 역종, 전화번호, 주소 순)</div>
                  <button onClick={parseOcrToPreview} style={{...s.btn(false),width:'100%'}}>📋 표로 변환 미리보기</button>
                </>
              )}

              {ocrPreview.length>0 && (
                <>
                  <div style={{fontSize:9,fontWeight:700,color:C.gold,letterSpacing:2,fontFamily:fontMono}}>미리보기 ({ocrPreview.filter(p=>p.include).length}/{ocrPreview.length}명 선택됨)</div>
                  <div style={{display:'flex',flexDirection:'column',gap:5,maxHeight:220,overflowY:'auto'}}>
                    {ocrPreview.map((p,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:6,background:C.bg2,border:`1px solid ${C.g4}`,padding:'6px 8px',opacity:p.include?1:.4}}>
                        <input type="checkbox" checked={p.include} onChange={()=>setOcrPreview(pv=>pv.map((x,xi)=>xi===i?{...x,include:!x.include}:x))}/>
                        <div style={{flex:1,fontSize:11}}>
                          <strong>{p.name}</strong> {p.year&&`· ${p.year}년차`} {p.role&&`· ${p.role}`}
                          <div style={{fontSize:9,color:C.txt3}}>{p.phone} {p.address}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button onClick={confirmOcrImport} style={{...s.btn(true),width:'100%'}}>✅ 선택한 대원 일괄 추가</button>
                </>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ══════════ 소집확인 항목 설정 모달 (QR 생성 전 단계) ══════════ */}
      {showCheckinItemsModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:530,display:'flex',alignItems:isMobile?'flex-end':'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderTop:`3px solid ${C.gold}`,width:isMobile?'100%':420,maxWidth:'96vw',maxHeight:'88vh',overflowY:'auto'}}>
            <div style={{background:C.bg2,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.g4}`,position:'sticky',top:0}}>
              <div style={{fontSize:14,fontWeight:900,color:C.gold}}>✅ 소집확인 항목 설정</div>
              <button onClick={()=>setShowCheckinItemsModal(false)} style={{background:'transparent',border:'none',color:C.txt3,fontSize:20,cursor:'pointer'}}>✕</button>
            </div>
            <div style={{padding:14}}>
              <div style={{fontSize:10,color:C.txt3,marginBottom:10,lineHeight:1.6}}>대원이 소집확인할 때 이름·군번·전투식량 취식여부 외에 추가로 체크할 항목을 등록하세요. (예: 전투복 착용, 개인화기 휴대, 방독면 지참 등) 한 번 등록하면 다음 훈련에도 그대로 재사용됩니다.</div>
              <div style={{display:'flex',gap:6,marginBottom:10}}>
                <input value={newCheckinItem} onChange={e=>setNewCheckinItem(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addCheckinItem();}} placeholder="예: 전투복 착용 확인" style={{...s.input,flex:1}}/>
                <button onClick={addCheckinItem} style={s.btn(true)}>+ 추가</button>
              </div>
              {checkinItems.length===0 ? <div style={{fontSize:11,color:C.txt3,padding:'8px 0'}}>등록된 확인 항목 없음 (없어도 QR 생성 가능)</div> : (
                <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:12}}>
                  {checkinItems.map((item,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:C.bg2,border:`1px solid ${C.g4}`,padding:'6px 10px'}}>
                      <span style={{flex:1,fontSize:12}}>{i+1}. {item}</span>
                      <button onClick={()=>delCheckinItem(i)} style={{background:'transparent',border:'none',color:C.txt3,cursor:'pointer',fontSize:13}}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div style={{padding:'9px 14px',borderTop:`1px solid ${C.g4}`,display:'flex',gap:6,justifyContent:'flex-end',background:C.bg2,position:'sticky',bottom:0}}>
              <button onClick={()=>setShowCheckinItemsModal(false)} style={s.btn(false)}>취소</button>
              <button onClick={()=>generateCheckinQR(pendingQrTrain)} disabled={qrBusy} style={s.btn(true)}>{qrBusy?'생성 중...':'📱 QR 생성'}</button>
            </div>
          </div>
        </div>
      )}

      {/* ══════════ QR 체크인 코드 모달 ══════════ */}
      {showQrModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:530,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`2px solid ${C.gold}`,width:isMobile?'90%':360,maxWidth:'96vw',padding:20,textAlign:'center'}}>
            <div style={{fontSize:14,fontWeight:900,color:C.gold,marginBottom:14}}>📱 훈련 소집 QR</div>
            <div style={{background:'#fff',padding:12,display:'inline-block'}}>
              <img src={`https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(qrUrl)}`} alt="소집 QR코드" style={{display:'block',width:220,height:220}}/>
            </div>
            <div style={{fontSize:10,color:C.txt3,marginTop:12,wordBreak:'break-all'}}>{qrUrl}</div>
            <div style={{fontSize:10,color:C.txt3,marginTop:8,lineHeight:1.6}}>대원들이 각자 폰으로 이 QR을 스캔하면, 본인 이름 입력 + 전투식량 취식여부로 소집 확인할 수 있습니다.</div>
            <div style={{fontSize:9,color:C.txt3,marginTop:6}}>(폰에서는 QR 이미지를 길게 눌러 "이미지 저장"도 가능합니다)</div>
            <a href={`https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(qrUrl)}`} download={`소집QR_${checkinStatusTrain?checkinStatusTrain.trainDate:pendingQrTrain?pendingQrTrain.trainDate:'훈련'}.png`} target="_blank" rel="noreferrer"
              style={{...s.btn(false),display:'block',width:'100%',marginTop:12,textDecoration:'none',boxSizing:'border-box'}}>💾 QR 이미지 저장</a>
            <button onClick={()=>setShowQrModal(false)} style={{...s.btn(true),width:'100%',marginTop:8}}>닫기</button>
          </div>
        </div>
      )}

      {/* ══════════ 소집 현황 모달 ══════════ */}
      {showCheckinStatus && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:530,display:'flex',alignItems:isMobile?'flex-end':'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderTop:`3px solid ${C.gold}`,width:isMobile?'100%':420,maxWidth:'96vw',maxHeight:'80vh',overflowY:'auto'}}>
            <div style={{background:C.bg2,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.g4}`,position:'sticky',top:0}}>
              <div style={{fontSize:14,fontWeight:900,color:C.gold}}>📊 소집 현황 {checkinStatusTrain && `(${checkinStatusTrain.trainDate})`}</div>
              <button onClick={()=>setShowCheckinStatus(false)} style={{background:'transparent',border:'none',color:C.txt3,fontSize:20,cursor:'pointer'}}>✕</button>
            </div>
            <div style={{padding:14}}>
              {checkinLoading ? <div style={{textAlign:'center',color:C.txt3,padding:20}}>불러오는 중...</div> : (
                <>
                  <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center',flexWrap:'wrap'}}>
                    <label style={{fontSize:11,color:C.txt3}}>대상</label>
                    <input type="number" value={checkinTarget} onChange={e=>setCheckinTarget(e.target.value)} placeholder="총 인원" style={{...s.input,width:70,padding:'5px 6px'}}/>
                  </div>
                  <div style={{marginBottom:10}}>
                    <label style={{fontSize:11,color:C.txt3}}>연기자 이름 (쉼표로 구분)</label>
                    <input value={checkinPostponed} onChange={e=>setCheckinPostponed(e.target.value)} placeholder="예: 김대리, 박대리" style={{...s.input,marginTop:4}}/>
                  </div>
                  <div style={{display:'flex',gap:12,marginBottom:12,fontSize:12,flexWrap:'wrap'}}>
                    <span>대상 <b style={{color:C.txt2}}>{parseInt(checkinTarget)||0}</b>명</span>
                    <span>소집 <b style={{color:C.gold}}>{checkinEntries.length}</b>명</span>
                    <span>연기 <b style={{color:C.blue3}}>{checkinPostponed.split(',').map(s=>s.trim()).filter(Boolean).length}</b>명</span>
                    <span>불참 <b style={{color:C.red2}}>{Math.max(0,(parseInt(checkinTarget)||0)-checkinEntries.length-checkinPostponed.split(',').map(s=>s.trim()).filter(Boolean).length)}</b>명</span>
                  </div>
                  <div style={{display:'flex',gap:10,marginBottom:8,fontSize:11}}>
                    <span>취식 <b style={{color:C.g8}}>{checkinEntries.filter(e=>e.ration==='yes').length}</b>명</span>
                    <span>미취식 <b style={{color:C.red2}}>{checkinEntries.filter(e=>e.ration==='no').length}</b>명</span>
                  </div>
                  {checkinEntries.length===0 ? <div style={{textAlign:'center',color:C.txt3,padding:20}}>아직 소집 확인한 대원이 없습니다</div> : (
                    <>
                      <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:8}}>
                        <div style={{display:'flex',alignItems:'center',gap:8,background:C.bg2,border:`1px solid ${C.g4}`,padding:'8px 10px'}}>
                          <input type="checkbox" checked={!!selectedCopyFields.attend} onChange={()=>toggleCopyField('attend')} style={{width:16,height:16,flexShrink:0}}/>
                          <span style={{flex:1,fontSize:12}}>소집명단 <b style={{color:C.gold}}>{checkinEntries.length}</b>명</span>
                          <button onClick={()=>copyCheckinField('attend')} style={{...s.btn(false),fontSize:10,padding:'5px 10px'}}>📋 단독복사</button>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:8,background:C.bg2,border:`1px solid ${C.g4}`,padding:'8px 10px'}}>
                          <input type="checkbox" checked={!!selectedCopyFields.ration_yes} onChange={()=>toggleCopyField('ration_yes')} style={{width:16,height:16,flexShrink:0}}/>
                          <span style={{flex:1,fontSize:12}}>전투식량 취식 <b style={{color:C.g8}}>{checkinEntries.filter(e=>e.ration==='yes').length}</b>명</span>
                          <button onClick={()=>copyCheckinField('ration_yes')} style={{...s.btn(false),fontSize:10,padding:'5px 10px'}}>📋 단독복사</button>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:8,background:C.bg2,border:`1px solid ${C.g4}`,padding:'8px 10px'}}>
                          <input type="checkbox" checked={!!selectedCopyFields.ration_no} onChange={()=>toggleCopyField('ration_no')} style={{width:16,height:16,flexShrink:0}}/>
                          <span style={{flex:1,fontSize:12}}>전투식량 미취식 <b style={{color:C.red2}}>{checkinEntries.filter(e=>e.ration==='no').length}</b>명</span>
                          <button onClick={()=>copyCheckinField('ration_no')} style={{...s.btn(false),fontSize:10,padding:'5px 10px'}}>📋 단독복사</button>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:8,background:C.bg2,border:`1px solid ${C.g4}`,padding:'8px 10px'}}>
                          <input type="checkbox" checked={!!selectedCopyFields.postponed} onChange={()=>toggleCopyField('postponed')} style={{width:16,height:16,flexShrink:0}}/>
                          <span style={{flex:1,fontSize:12}}>연기 <b style={{color:C.blue3}}>{checkinPostponed.split(',').map(s=>s.trim()).filter(Boolean).length}</b>명</span>
                          <button onClick={()=>copyCheckinField('postponed')} style={{...s.btn(false),fontSize:10,padding:'5px 10px'}}>📋 단독복사</button>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:8,background:C.bg2,border:`1px solid ${C.g4}`,padding:'8px 10px'}}>
                          <input type="checkbox" checked={!!selectedCopyFields.detail} onChange={()=>toggleCopyField('detail')} style={{width:16,height:16,flexShrink:0}}/>
                          <span style={{flex:1,fontSize:12}}>상세내역 (취식여부·확인항목)</span>
                          <button onClick={()=>copyCheckinField('detail')} style={{...s.btn(false),fontSize:10,padding:'5px 10px'}}>📋 단독복사</button>
                        </div>
                      </div>
                      <button onClick={copySelectedCheckinFields} style={{...s.btn(true),width:'100%',marginBottom:12}}>☑ 체크한 항목 한번에 복사</button>
                      <div style={{fontSize:9,color:C.txt3,marginBottom:5}}>전체 내용을 직접 보고 드래그로 선택·복사할 수도 있습니다</div>
                      <textarea readOnly value={buildCheckinSummaryText()} onClick={e=>e.target.select()}
                        style={{width:'100%',minHeight:180,background:C.bg2,border:`1px solid ${C.g4}`,color:C.txt,fontFamily:fontMono,fontSize:11,padding:10,resize:'vertical',outline:'none',lineHeight:1.7,boxSizing:'border-box'}}/>
                    </>
                  )}
                  <div style={{display:'flex',gap:6,marginTop:12}}>
                    <button onClick={()=>openCheckinStatus(checkinStatusTrain)} style={{...s.btn(false),flex:1}}>🔄 새로고침</button>
                    <button onClick={copyCheckinSummary} style={{...s.btn(true),flex:1}}>📋 전체 복사</button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ══════════ 훈련계획 절차 편집 모달 ══════════ */}
      {showDdStepModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:520,display:'flex',alignItems:isMobile?'flex-end':'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderTop:`3px solid ${C.gold}`,width:isMobile?'100%':420,maxWidth:'96vw',maxHeight:'92vh',overflowY:'auto'}}>
            <div style={{background:C.bg2,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.g4}`,position:'sticky',top:0}}>
              <div style={{fontSize:14,fontWeight:900,color:C.gold}}>{ddStepEditId?'절차 수정':'절차 추가'}</div>
              <button onClick={()=>setShowDdStepModal(false)} style={{background:'transparent',border:'none',color:C.txt3,fontSize:20,cursor:'pointer'}}>✕</button>
            </div>
            <div style={{padding:14,display:'flex',flexDirection:'column',gap:9}}>
              <div style={{display:'flex',flexDirection:'column',gap:3}}>
                <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>업무명 *</label>
                <input value={ddStepForm.name} onChange={e=>setDdStepForm(f=>({...f,name:e.target.value}))} style={s.input}/>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
                <div style={{display:'flex',flexDirection:'column',gap:3}}>
                  <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>훈련일 기준 (D±n, 예: -8, 0, 1)</label>
                  <input type="number" value={ddStepForm.d} onChange={e=>setDdStepForm(f=>({...f,d:parseInt(e.target.value)||0}))} style={s.input}/>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:3}}>
                  <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>담당</label>
                  <select value={ddStepForm.owner} onChange={e=>setDdStepForm(f=>({...f,owner:e.target.value}))} style={s.input}>
                    <option value="나">나(기동대)</option>
                    <option value="대대">대대</option>
                    <option value="사단">사단</option>
                  </select>
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:3}}>
                <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>설명</label>
                <textarea value={ddStepForm.desc} onChange={e=>setDdStepForm(f=>({...f,desc:e.target.value}))} style={{width:'100%',background:C.bg2,border:`1px solid ${C.g4}`,color:C.txt,fontFamily:fontMono,fontSize:11,padding:8,resize:'vertical',minHeight:50,outline:'none',lineHeight:1.6}}/>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
                <div style={{display:'flex',flexDirection:'column',gap:3}}>
                  <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>근거·비고</label>
                  <input value={ddStepForm.law} onChange={e=>setDdStepForm(f=>({...f,law:e.target.value}))} placeholder="정말 참고할 근거만 (없으면 비워두세요)" style={s.input}/>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:3}}>
                  <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>색상</label>
                  <select value={ddStepForm.cls} onChange={e=>setDdStepForm(f=>({...f,cls:e.target.value}))} style={s.input}>
                    <option value="red">빨강</option><option value="gold">금색</option><option value="blue">파랑</option>
                    <option value="green">초록</option><option value="orange">주황</option><option value="purple">보라</option>
                  </select>
                </div>
              </div>
            </div>
            <div style={{padding:'9px 14px',borderTop:`1px solid ${C.g4}`,display:'flex',gap:6,justifyContent:'flex-end',background:C.bg2,position:'sticky',bottom:0}}>
              <button onClick={()=>setShowDdStepModal(false)} style={s.btn(false)}>취소</button>
              <button onClick={saveDdStep} style={s.btn(true)}>💾 저장</button>
            </div>
          </div>
        </div>
      )}

      {/* ══════════ 미계획 업무 진입 팝업 (피드백③) ══════════ */}
      {showUnplannedModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`1px solid ${C.red2}`,borderTop:`4px solid ${C.red3}`,width:isMobile?'92%':380,padding:18}}>
            <div style={{fontSize:15,fontWeight:900,color:C.red3,marginBottom:8}}>⚠ 미계획 업무 있음</div>
            <div style={{fontSize:12,color:C.txt2,marginBottom:10,lineHeight:1.6}}>날짜 지정이 필요한 업무가 <b style={{color:C.gold}}>{unplannedTasks.length}건</b> 있습니다.</div>
            <ul style={{margin:'0 0 12px',padding:'0 0 0 16px',fontSize:12,color:C.txt}}>
              {unplannedTasks.slice(0,5).map(t=><li key={t.id} style={{marginBottom:3}}>{t.text}</li>)}
            </ul>
            <div style={{display:'flex',gap:6}}>
              <button onClick={()=>setShowUnplannedModal(false)} style={{...s.btn(false),flex:1}}>나중에</button>
              <button onClick={()=>{setShowUnplannedModal(false);setMode('master');}} style={{...s.btn(true),flex:1}}>지금 계획하기</button>
            </div>
          </div>
        </div>
      )}

      {/* ══════════ Firebase 클라우드 동기화 설정 ══════════ */}
      {showCloudCfg && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:520,display:'flex',alignItems:isMobile?'flex-end':'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderTop:`3px solid ${C.gold}`,width:isMobile?'100%':440,maxWidth:'96vw',maxHeight:isMobile?'90vh':'92vh',overflowY:'auto'}}>
            <div style={{background:C.bg2,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.g4}`,position:'sticky',top:0}}>
              <div style={{fontSize:14,fontWeight:900,color:C.gold}}>⚙ 클라우드 동기화 설정</div>
              <button onClick={()=>setShowCloudCfg(false)} style={{background:'transparent',border:'none',color:C.txt3,fontSize:20,cursor:'pointer'}}>✕</button>
            </div>
            <div style={{padding:14,display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:11,color:C.txt2,lineHeight:1.6}}>
                본인 소유 Firebase 프로젝트(Firestore)의 설정값과 코드를 입력하고 "연결"을 누르세요. 자동으로는 절대 연결되지 않으며, 직접 누를 때만 연결됩니다. 연결 즉시 그 코드로 저장된 지난 기록이 있으면 자동으로 불러올지 물어봅니다. 이후에는 저장할 때마다 자동으로 클라우드에도 백업됩니다.
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>Firebase 설정값 {cfgUnlocked?'(수정 가능)':'(숨김)'}</div>
                <button onClick={()=>setCfgUnlocked(v=>!v)} style={{...s.btn(false),fontSize:9,padding:'4px 8px'}}>{cfgUnlocked?'🔒 잠그기':'✏ 수정'}</button>
              </div>
              {!cfgUnlocked
                ? <div style={{fontSize:10,color:C.txt3,padding:'6px 0'}}>"✏ 수정"을 눌러야 값이 표시·편집됩니다{cloudCfg.apiKey?' (현재 설정값 저장됨)':''}</div>
                : ['apiKey','authDomain','projectId','appId'].map(k=>(
                    <div key={k} style={{display:'flex',flexDirection:'column',gap:3}}>
                      <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>{k}</label>
                      <input value={cloudCfg[k]||''} onChange={e=>setCloudCfg(c=>({...c,[k]:e.target.value}))} style={s.input}/>
                    </div>
                  ))
              }
              <div style={{display:'flex',flexDirection:'column',gap:3}}>
                <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>코드 (기기간 동일하게 입력)</label>
                <input value={cloudCfg.syncKey||''} onChange={e=>setCloudCfg(c=>({...c,syncKey:e.target.value}))} placeholder="예: gidongdae_cxb767" style={s.input}/>
              </div>
              <div style={{fontSize:9,color:C.txt3,lineHeight:1.6}}>
                ※ Firestore 보안규칙을 본인만 접근 가능하도록 별도 설정하는 것을 권장합니다. 규칙 설정 없이는 코드를 아는 누구나 접근 가능합니다.
              </div>
            </div>
            <div style={{padding:'9px 14px',borderTop:`1px solid ${C.g4}`,display:'flex',gap:6,justifyContent:'flex-end',background:C.bg2,position:'sticky',bottom:0,flexWrap:'wrap'}}>
              <button onClick={()=>{save(K.CFG,cloudCfg); window.__gdtInitCloud && window.__gdtInitCloud(); setCfgUnlocked(false);}} style={s.btn(false)}>🔌 연결</button>
              <button onClick={()=>window.__gdtCloudPush && window.__gdtCloudPush()} style={s.btn(false)}>⬆ 업로드</button>
              <button onClick={()=>window.__gdtCloudPull && window.__gdtCloudPull()} style={s.btn(false)}>⬇ 다운로드</button>
              <button onClick={()=>setShowCloudCfg(false)} style={s.btn(true)}>닫기</button>
            </div>
          </div>
        </div>
      )}

      <style>{`@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
