// 마지막 날짜 계산 (분기말)
function quarterLastDay(y, qEndMonth){ return lastDay(y, qEndMonth); } // qEndMonth: 0-index (2,5,8,11)

// 특정 연/월에 대해 마스터 업무가 실제로 "발생"하는 날짜(들)를 계산 (공휴일/주말 보정 포함)
function computeOccurrenceDates(task, y, m){
  // returns array of {y,m,d} raw due dates that fall in or near month m (for weekly: every week in month)
  const res = [];
  const last = lastDay(y,m);
  if(task.period==='weekly'){
    for(let d=1; d<=last; d++){ if(new Date(y,m,d).getDay()===task.dow) res.push({y,m,d}); }
  } else if(task.period==='nthweek'){
    // 매월 n째주 요일 (예: 첫째·셋째 주 월요일) — nth: [1,3] 등, dow: 0~6
    let occurrence = 0;
    for(let d=1; d<=last; d++){
      if(new Date(y,m,d).getDay()===task.dow){
        occurrence++;
        const isLast = (d+7)>last; // 이 날짜 이후 같은 요일이 이 달에 더 없으면 '마지막주'
        if((task.nth||[]).includes(occurrence) || ((task.nth||[]).includes('last') && isLast)) res.push({y,m,d});
      }
    }
  } else if(task.period==='monthly'){
    const dd = task.day==='last' ? last : Math.min(task.day,last);
    res.push({y,m,d:dd});
  } else if(task.period==='quarterly'){
    if([2,5,8,11].includes(m)){ const dd = task.day==='last'?last:Math.min(task.day,last); res.push({y,m,d:dd}); }
  } else if(task.period==='halfyear'){
    if((task.months||[]).includes(m+1)){ const dd = task.day==='last'?last:Math.min(task.day,last); res.push({y,m,d:dd}); }
  } else if(task.period==='yearly'){
    if(task.month===m+1){ const dd = task.day==='last'?last:Math.min(task.day,last); res.push({y,m,d:dd}); }
  }
  return res;
}

// 보정된(공휴일 이동 반영) 실제 시행일 목록 계산 (전달 말일까지 넓게 훑어서 이월되는 경우도 포착)
function getShiftedOccurrences(task, y, m){
  const out = [];
  // 인접 월(전월 말/익월 초)까지 포함해서 계산 후 보정, 보정결과가 이번 달(m)에 속하는 것만 채택
  for(const dm of [-1,0,1]){
    let ty=y, tm=m+dm;
    if(tm<0){tm=11;ty=y-1;} if(tm>11){tm=0;ty=y+1;}
    const raws = computeOccurrenceDates(task, ty, tm);
    for(const r of raws){
      const shifted = task.holidayShift ? shiftForHoliday(r.y,r.m,r.d) : new Date(r.y,r.m,r.d);
      if(shifted.getFullYear()===y && shifted.getMonth()===m){
        out.push({ due:new Date(r.y,r.m,r.d), shifted, key:dk(shifted.getFullYear(),shifted.getMonth(),shifted.getDate()) });
      }
    }
  }
  return out;
}

// 연차별 훈련유형 — [별표 3] 예비군훈련 유형 및 대상자별 훈련기간(제8조 관련) 기준으로 정정
// 병 1~4년차: 동원소집대상자→동원Ⅰ형(28H,숙영) / 미대상자→동원Ⅱ형(32H,비숙영) / 공군병→동원Ⅱ형(28H,숙영,예외)
// 병 5~6년차: 기본훈련(8H) + 작계훈련(12H) — 동원훈련 없음
// 병 7~8년차: 미이수훈련(과년도 미이수분만 해당, 정규훈련 없음)
// 간부 1~6년차: 동원소집대상자→동원Ⅰ형(28H) / 미대상자→동원Ⅱ형(28H,숙영,예외) — 간부는 미대상자도 숙영
// 간부 7년차~연령정년: 미이수훈련
// 신규 전역자(당해연도, year=0): 훈련 없음
// ══════════════════════════════════════════
function isOfficerRole(role){ return (role||'').includes('장교') || (role||'').includes('부사관'); }
function getYRT(p){
  const y = parseInt(p.year);
  if(!y || y===0) return [];
  const officer = isOfficerRole(p.role);
  const mob = p.mobileTarget!=='no'; // 기본값 대상
  const airforce = p.branch==='공군';
  if(officer){
    if(y>=1 && y<=6) return mob ? ['동원Ⅰ형(28H·숙영)'] : ['동원Ⅱ형(28H·숙영·간부예외)'];
    return ['미이수훈련'];
  }
  if(y>=1 && y<=4){
    if(airforce) return ['동원Ⅱ형(28H·숙영·공군예외)'];
    return mob ? ['동원Ⅰ형(28H·숙영)'] : ['동원Ⅱ형(32H·비숙영)'];
  }
  if(y>=5 && y<=6) return ['기본훈련(8H)','작계훈련(12H)'];
  return ['미이수훈련']; // 7~8년차
}

function getBarColor(pct) { return pct>=100?C.g7:pct>=50?C.g8:pct>0?C.orange:C.red; }

function calcProg(p, trainLog) {
  const types = getYRT(p);
  const logs = trainLog[p.id]||[];
  const done = logs.filter(l=>l.result==='참가').length;
  return { done, total:types.length, pct:types.length?Math.min(100,Math.round(done/types.length*100)):0 };
}

function getTasks(y,m,d,custom) {
  const key=dk(y,m,d);
  const tasks=[];
  if(custom[key]) for(const ct of custom[key]) tasks.push({text:ct.text, cls:ct.cls||'green', law:'사용자 등록'});
  return tasks;
}

// 마스터 업무(반복 스케줄) → 해당 날짜에 실제 표시할 태그 목록 계산
// preview=true 이면 사용자가 등록한 사전준비 알림(D-n)만 포함해서 반환 (일반 자동예고는 제거됨 — 기본은 당일에만 표시)
function getMasterTasksForDate(y,m,d, masterTasks){
  const key = dk(y,m,d);
  const target = new Date(y,m,d); target.setHours(0,0,0,0);
  const out = [];
  for(const t of (masterTasks||[])){
    if(!t.active) continue;
    if(t.period==='daily') continue; // 일일업무는 달력 태그가 아닌 인라인패널·오늘업무탭에서 별도 처리
    if(t.needsPlanning){
      // 미계획업무: 사용자가 지정한 assignedDate에만 표시
      if(t.assignedDate===key) out.push({ text:t.text, cls:t.cls||'purple', law:t.law||'사용자 지정', masterId:t.id, unplanned:false, howto:t.howto||'', steps:t.steps||[], period:t.period });
      continue;
    }
    const occs = getShiftedOccurrences(t, y, m);
    for(const occ of occs){
      if(occ.key===key){
        out.push({ text:t.text, cls:t.cls||'green', law:t.law||'', masterId:t.id, preview:false, howto:t.howto||'', steps:t.steps||[], period:t.period });
      } else {
        const diff = Math.round((occ.shifted - target)/(1000*60*60*24));
        if(diff>0){
          // 사전준비 알림: 사용자가 직접 등록한 D-n과 정확히 일치하는 경우만 미리 표시 (그 외엔 당일에만 표시)
          (t.prep||[]).forEach(p=>{
            if(parseInt(p.days)===diff && p.text && p.text.trim()){
              out.push({ text:`(D-${diff}) ${p.text}`, cls:'red', law:`${t.text} 사전준비`, masterId:t.id, preview:true, isPrep:true, period:t.period });
            }
          });
        }
      }
    }
  }
  return out;
}

// 활성화된 period='daily' 마스터 업무를 섹션별로 묶어 기존 TASKS_DAILY와 동일한 구조로 반환
function buildDailyGroups(masterTasks){
  const items = (masterTasks||[]).filter(t=>t.active && t.period==='daily').sort((a,b)=>(a.order??0)-(b.order??0));
  if(!items.length) return [];
  return [{ sec:'일일업무', items: items.map(t=>({ t:t.text, l:t.law||'', howto:t.howto||'', steps:t.steps||[], period:'daily' })) }];
}

// 미계획 업무 목록 (needsPlanning=true 이면서 assignedDate가 없거나 이미 지난 업무)
function getUnplannedTasks(masterTasks){
  const todayKey = dk(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  return (masterTasks||[]).filter(t=>t.active && t.needsPlanning && (!t.assignedDate || t.assignedDate < todayKey));
}

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(window.innerWidth < 720);
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 720);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return isMobile;
}

function CheckinView({ trainId }){

  const [itemChecks, setItemChecks] = useState({});

  const [gunbun, setGunbun] = useState('');
  const [attend, setAttend] = useState(false);
  const [ration, setRation] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [err, setErr] = useState('');

  useEffect(()=>{
    (async ()=>{
      try{
        ensureFirebaseInit();
        const db = window.firebase.firestore();
        const doc = await db.collection('gdt_checkin').doc(trainId).get();
        if(!doc.exists){ setErr('훈련 정보를 찾을 수 없습니다. 담당자에게 문의하세요.'); setLoading(false); return; }
        const d = doc.data();
        setTrainInfo(d.trainInfo||null);
        setCheckItems(d.checkItems||[]);
      }catch(e){ setErr('불러오기 실패: '+e.message); }
      setLoading(false);
    })();
  }, [trainId]);

  function toggleItem(idx){ setItemChecks(prev=>({...prev, [idx]: !prev[idx]})); }

  async function submit(){
    if(!name.trim()){ alert('이름을 입력하세요.'); return; }
    if(!gunbun.trim()){ alert('군번을 입력하세요.'); return; }
    if(!attend){ alert('소집 확인을 체크하세요.'); return; }
    if(!ration){ alert('전투식량 취식 여부를 선택하세요.'); return; }
    const uncheckedIdx = checkItems.findIndex((_,i)=>!itemChecks[i]);
    if(uncheckedIdx!==-1){ alert(`"${checkItems[uncheckedIdx]}" 항목을 확인·체크하세요.`); return; }
    try{
      const db = window.firebase.firestore();
      await db.collection('gdt_checkin').doc(trainId).collection('entries').add({
        name: name.trim(), gunbun: gunbun.trim(), attended:true, ration,
        checkedItems: checkItems.map((it,i)=>({item:it, checked:!!itemChecks[i]})),
        ts: Date.now()
      });
      setSubmitted(true);
    }catch(e){ alert('제출 실패: '+e.message); }
  }

    <div style={{minHeight:'100vh',background:C.bg,color:C.txt,fontFamily:'sans-serif',padding:20,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <div style={{width:'100%',maxWidth:380,background:C.bg1,border:`1px solid ${C.g5}`,padding:20}}>
        <div style={{fontSize:16,fontWeight:900,color:C.gold,marginBottom:14,textAlign:'center'}}>📱 훈련 소집</div>
        {loading && <div style={{textAlign:'center',color:C.txt3}}>불러오는 중...</div>}
        {err && <div style={{textAlign:'center',color:C.red2}}>{err}</div>}
        {!loading && !err && !submitted && (
          <>
            {trainInfo && <div style={{textAlign:'center',fontSize:13,color:C.txt3,marginBottom:16}}>{trainInfo.trainDate} · {trainInfo.trainOrder}차 {trainInfo.trainType}{trainInfo.trainName?' · '+trainInfo.trainName:''}</div>}
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:C.txt3,marginBottom:5}}>이름</div>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="이름 입력" style={{width:'100%',padding:10,background:C.bg,border:`1px solid ${C.g5}`,color:C.txt,fontSize:14,boxSizing:'border-box'}}/>
            </div>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:C.txt3,marginBottom:5}}>군번</div>
              <input value={gunbun} onChange={e=>setGunbun(e.target.value)} placeholder="군번 입력" style={{width:'100%',padding:10,background:C.bg,border:`1px solid ${C.g5}`,color:C.txt,fontSize:14,boxSizing:'border-box'}}/>
            </div>
            <label style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,fontSize:14,cursor:'pointer'}}>
              <input type="checkbox" checked={attend} onChange={e=>setAttend(e.target.checked)} style={{width:18,height:18}}/>

                <div style={{fontSize:11,color:C.txt3,marginBottom:8}}>추가 확인 항목</div>
                {checkItems.map((item,i)=>(
                  <label key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,fontSize:13,cursor:'pointer'}}>

      ];
      const texts = new Set(result.map(t=>t.text));
      const toRemove = new Set();
      dupPairs.forEach(([oldT,newT])=>{ if(texts.has(oldT) && texts.has(newT)) toRemove.add(oldT); });
      // 보류 관련 업무는 기동대 조직상 해당 없음 — 남아있으면 무조건 제거

      // 핸드토키 채널 변경(매월 15일·말일) 등 새로 추가된 항목 자동 병합

        '전입자 처리': '전입 인원수·성명을 일일업무일지에 작성 후 저장',
        '전출자 확인·전입요청 처리': '전출 인원수·성명을 일일업무일지에 작성 후 저장',

        '연기원서 접수 및 처리': '대대에 수정보고 후 연명부 반영 확인',
        '소집통지서 전달 현황 확인': '발송건수를 일일업무일지에 작성',

    if(tcmRes==='미참'||tcmRes==='고발'){
      const np=[...persons]; const pi=np.findIndex(p=>p.id===tcmPid);
      if(pi>-1){

        if(cur<3) np[pi]={...np[pi], trainOrder:String(cur+1)};

  function calcDD() {
    if(!ddDate){alert('훈련 예정일을 선택하세요.');return;}
    const D=new Date(ddDate); D.setHours(0,0,0,0);
    const tod=new Date(); tod.setHours(0,0,0,0);
    const result=ddSteps.map(s=>{
      const td=new Date(D.getTime()); td.setDate(D.getDate()+s.d);
      const diff=Math.round((td-tod)/(1000*60*60*24));
      const dows=['일','월','화','수','목','금','토'];
      return {...s, date:`${td.getMonth()+1}.${td.getDate()}(${dows[td.getDay()]})`, diff,
        dateKey:dk(td.getFullYear(), td.getMonth(), td.getDate())};
    });
    setDdResult(result);
  }

  function getDdayTasksForDate(y, m, d) {
    const key = dk(y,m,d);
    const tasks = [];
    for(const train of ddTrains) {
      const D = new Date(train.trainDate); D.setHours(0,0,0,0);
      const label = `${train.trainOrder||1}차 ${train.trainType}${train.trainName?' · '+train.trainName:''}`;
      for(const step of ddSteps) {
        const td = new Date(D.getTime()); td.setDate(D.getDate()+step.d);
        const stepKey = dk(td.getFullYear(), td.getMonth(), td.getDate());
        if(stepKey===key) {
          const dLabel = step.d===0?'D-day':step.d>0?`D+${step.d}`:`D${step.d}`;
          const lawPart = step.law && !GENERIC_LAW.has(step.law) ? ` · ${step.law}` : '';
          tasks.push({ text:`[${dLabel}·${step.owner||'나'}담당] ${step.name}`, cls: step.cls||'blue', law:`${label}${lawPart}` });
        }
      }
    }
    return tasks;
  }

    if(t.period==='nthweek') return `매월 ${(t.nth||[]).map(n=>WEEK_ORD[n]||n).join('·')}주 ${DOW_NAME[t.dow]}요일`;
    if(t.period==='monthly') return `${periodLabel.monthly} ${t.day==='last'?'말일':t.day+'일'}`;
    if(t.period==='quarterly') return `${periodLabel.quarterly}`;
    if(t.period==='halfyear') return `${(t.months||[]).join('·')}월 ${t.day==='last'?'말일':t.day+'일'}`;
    if(t.period==='yearly') return `${t.month}월 ${t.day==='last'?'말일':t.day+'일'}`;
    if(t.period==='unplanned') return t.assignedDate?`지정일: ${t.assignedDate}`:'미지정';
    return '';
  }

  // ── 일일업무일지 자동 생성 ──
  function buildJournal() {
    const t=today, y=t.getFullYear(), m=t.getMonth(), d=t.getDate();
    const dows=['일','월','화','수','목','금','토'];
    const tomorrow=new Date(y,m,d+1);
    let txt = `[기동대장 일일업무일지] ${y}.${String(m+1).padStart(2,'0')}.${String(d).padStart(2,'0')}(${dows[new Date(y,m,d).getDay()]})\n`;
    txt += `${'─'.repeat(30)}\n`;
    if(!isWorkday(y,m,d)){
      txt += `※ 금일은 휴무일(토·일요일 또는 공휴일)로 출근하지 않았습니다.\n`;
    } else {
      txt += `■ 금일 실시업무 (완료/미완료)\n`;
      buildDailyGroups(masterTasks).forEach(sec=>{
        txt += `【${sec.sec}】\n`;
        sec.items.forEach(item=>{
          const bk = dailyKey+'_daily_'+item.t;
          const hasSteps = item.steps && item.steps.length;
          const isNA = hasSteps && checks[bk+'__na'];
          const done = hasSteps ? (isNA || item.steps.every((_,si)=>checks[bk+'__s'+si])) : checks[bk];
          const mark = isNA ? '–' : (done ? '✓' : '☐');
          const suffix = isNA ? ' (해당없음)' : (done ? '' : ' (미완료)');
          txt += `${mark} ${item.t}${suffix}\n`;
        });
      });
    }
    const ddToday = getDdayTasksForDate(y,m,d);
    if(ddToday.length){
      txt += `\n■ 금일 D-day 해당 업무\n`;
      ddToday.forEach(x=>{ txt += `• ${x.text} (${x.law})\n`; });
    }
    const masterToday = getMasterTasksForDate(y,m,d,masterTasks).filter(x=>!x.preview);
    if(masterToday.length){
      txt += `\n■ 금일 순기·지정 업무\n`;
      masterToday.forEach(x=>{ const done=checks[dk(y,m,d)+'_'+x.text]; txt += `${done?'✓':'☐'} ${x.text} (${x.law})\n`; });
    }
    if(memos[dailyKey]){
      txt += `\n■ 메모\n${memos[dailyKey]}\n`;
    }
    // 내일 예정 업무
    const ty=tomorrow.getFullYear(), tm=tomorrow.getMonth(), td=tomorrow.getDate();
    const tmMaster = getMasterTasksForDate(ty,tm,td,masterTasks).filter(x=>!x.preview);
    const tmDd = getDdayTasksForDate(ty,tm,td);
    const tmBase = getTasks(ty,tm,td,custom);
    const tmAll = [...tmMaster, ...tmDd, ...tmBase];
    txt += `\n■ 명일(${tm+1}.${td}) 예정 업무\n`;
    txt += tmAll.length ? tmAll.map(x=>`• ${x.text}`).join('\n') : '（지정된 순기·특이 업무 없음）';
    txt += `\n${'─'.repeat(30)}\n작성: 기동대장`;
    return txt;
  }

  const filteredPersons = persons.filter(p=>{
    const q=srch.toLowerCase();
    const qm=!q||(p.name||'').includes(q)||(p.phone||'').includes(q)||(p.address||'').toLowerCase().includes(q);
    return qm && (!fSt||p.status===fSt) && (!fYr||String(p.year)===fYr);
  }).sort((a,b)=>{
    let av=sortCol==='no'?0:a[sortCol]??'', bv=sortCol==='no'?0:b[sortCol]??'';
    if(typeof av==='string') return av.localeCompare(bv,'ko')*sortDir;
    return (av-bv)*sortDir;
  });
  function srt(c) { if(sortCol===c) setSortDir(d=>d*-1); else{setSortCol(c);setSortDir(1);} }

  const filteredForTrain = tyFilter===0?persons:persons.filter(p=>parseInt(p.year)===tyFilter);
  const allTypes = [...new Set(filteredForTrain.flatMap(p=>getYRT(p)))];
  const warns = persons.filter(p=>parseInt(p.trainOrder||1)>=3);

  const todayIsWorkday = isWorkday(today.getFullYear(), today.getMonth(), today.getDate());
  const todayMasterExtra = getMasterTasksForDate(today.getFullYear(), today.getMonth(), today.getDate(), masterTasks).filter(t=>!t.preview);
  const todayDdExtra = getDdayTasksForDate(today.getFullYear(), today.getMonth(), today.getDate());
  const todayExtraGroup = (todayMasterExtra.length||todayDdExtra.length)
    ? [{ sec:'오늘의 순기·D-day 업무', badge:'중요', items:[...todayMasterExtra, ...todayDdExtra].map(x=>({t:x.text, l:x.law||'', howto:x.howto||'', steps:x.steps||[], period:x.period})) }]
    : [];
  const curTaskTab = taskTab==='daily'
    ? { key:'daily', label:'일일', data: todayIsWorkday ? [...todayExtraGroup, ...buildDailyGroups(masterTasks)] : [] }
    : TASK_TABS.find(t=>t.key===taskTab);
  const itemDone = (item) => {
    const bk = dailyKey+'_'+taskTab+'_'+item.t;
    if(item.steps && item.steps.length) return checks[bk+'__na'] || item.steps.every((_,si)=>checks[bk+'__s'+si]);
    return !!checks[bk];
  };
  const taskTotal = curTaskTab.data.reduce((a,s)=>a+s.items.length,0);
  const taskDone = curTaskTab.data.reduce((a,s)=>a+s.items.filter(itemDone).length,0);

  // ── 날짜클릭 단일 패널 데이터 (달력 그리드는 절대 안 건드림 — 별도 패널에만 표시) ──
  const selIsWorkday = selDate ? (()=>{ const [y,m,d]=selDate.split('-').map(Number); return isWorkday(y,m-1,d); })() : true;
  const selDailyFlat = (selDate && selIsWorkday) ? buildDailyGroups(masterTasks).flatMap(sec=>sec.items.map(i=>({
    text:i.t, law:i.l, cls:'red', isDaily:true, checkKey: selDate+'_daily_'+i.t, howto:i.howto||'', steps:i.steps||[], period:'daily'
  }))) : [];
  const selTasks = selDate ? (() => {
    const [y,m,d]=selDate.split('-').map(Number);
    const base = getTasks(y,m-1,d,custom); // 사용자 등록 업무(업무추가)
    const master = getMasterTasksForDate(y,m-1,d,masterTasks).filter(t=>!t.preview); // 순기+미계획 지정된 업무
    const preview = getMasterTasksForDate(y,m-1,d,masterTasks).filter(t=>t.preview); // 사전준비 알림(등록된 D-n)만
    const ddTasks = getDdayTasksForDate(y,m-1,d);
    return [...selDailyFlat, ...master, ...base, ...ddTasks, ...preview];
  })() : [];
  const selItemDone = (t) => {
    const bk = t.checkKey || (selDate+'_'+t.text);
    if(t.steps && t.steps.length) return checks[bk+'__na'] || t.steps.every((_,si)=>checks[bk+'__s'+si]);
    return !!checks[bk];
  };
  const selCheckable = selTasks.filter(t=>!t.preview);
  const selDone = selCheckable.filter(selItemDone).length;
  const selPct = selCheckable.length?Math.round(selDone/selCheckable.length*100):0;


  // ── 스타일 헬퍼 ──
  const fontSans = "'Noto Sans KR',-apple-system,sans-serif";
  const fontMono = "'IBM Plex Mono',monospace";
  const s = {
    tab: (on) => ({ background:on?C.g5:C.bg2, border:`1px solid ${on?C.gold:C.g5}`, color:on?C.gold:C.txt3,
      padding: isMobile?'8px 10px':'6px 10px', fontSize:isMobile?11:11, fontWeight:700, cursor:'pointer', fontFamily:fontSans, flex:isMobile?'1 1 auto':'none' }),
    input: { background:C.bg2, border:`1px solid ${C.g4}`, color:C.txt, fontSize:13, padding:'8px 9px', outline:'none', fontFamily:fontSans, width:'100%' },
    btn: (pri) => ({ background:pri?C.gold:C.bg3, border:`1px solid ${pri?C.gold:C.g6}`, color:pri?C.bg:C.tan, padding:'8px 12px', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:fontSans }),
  };

  // QR 스캔으로 접속한 경우(?checkin=훈련ID) — 앱 본체 대신 체크인 전용 화면만 표시
  const urlCheckinId = new URLSearchParams(window.location.search).get('checkin');
  if(urlCheckinId){
    return <CheckinView trainId={urlCheckinId} />;
  }

  return (
    <div style={{fontFamily:fontSans, background:C.bg, color:C.txt, minHeight:'100vh', paddingBottom: isMobile?60:0}}>
      <style>{`
        @media print {
          body * { visibility: hidden !important; }
          body[data-print="daily"] .print-daily, body[data-print="daily"] .print-daily * { visibility: visible !important; }
          body[data-print="cal"] .print-cal, body[data-print="cal"] .print-cal * { visibility: visible !important; }
          body[data-print="rwlog"] .print-rwlog, body[data-print="rwlog"] .print-rwlog * { visibility: visible !important; }
          body[data-print="combo"] .print-cal, body[data-print="combo"] .print-cal *,
          body[data-print="combo"] .print-daily, body[data-print="combo"] .print-daily * { visibility: visible !important; }
          .print-daily, .print-cal, .print-rwlog { display:block !important; position:absolute; top:0; left:0; width:100%; background:#fff; color:#000; font-family:'Malgun Gothic',sans-serif; }
          body[data-print="combo"] .print-cal, body[data-print="combo"] .print-daily { display:block !important; position:static !important; page-break-after: always; }
          body[data-print="combo"] .print-daily { page-break-after: auto; }
          @page { margin: 14mm; }
        }
        .print-daily, .print-cal, .print-rwlog { display:none; }
      `}</style>

      {/* ══════════ 인쇄 전용: 월력표 (통합인쇄시 항상 맨 앞장) ══════════ */}
      <div className="print-cal">
        <h1 style={{fontSize:18,borderBottom:'2px solid #000',paddingBottom:8,marginBottom:10}}>{curY}년 {MONTHS[curM]} 월력표</h1>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:10,tableLayout:'fixed'}}>
          <thead><tr>
            {['일','월','화','수','목','금','토'].map(d=><th key={d} style={{border:'1px solid #999',padding:4,background:'#eee'}}>{d}</th>)}
          </tr></thead>
          <tbody>
            {(()=>{
              const cells = renderCal();
              const rows = [];
              for(let i=0;i<cells.length;i+=7) rows.push(cells.slice(i,i+7));
              return rows.map((row,ri)=>(
                <tr key={ri}>
                  {row.map((cell,ci)=>{
                    const {y,m,d,other}=cell;
                    if(other) return <td key={ci} style={{border:'1px solid #ccc',height:70,verticalAlign:'top',padding:3,color:'#bbb'}}>{d}</td>;
                    const baseTasks=getTasks(y,m,d,custom);
                    const ddTasks=getDdayTasksForDate(y,m,d);
                    const masterHere=getMasterTasksForDate(y,m,d,masterTasks).filter(t=>!t.preview);
                    const tasks=[...masterHere,...baseTasks,...ddTasks];
                    return (
                      <td key={ci} style={{border:'1px solid #999',height:70,verticalAlign:'top',padding:3}}>
                        <div style={{fontWeight:700,marginBottom:2}}>{d}</div>
                        {tasks.slice(0,5).map((t,ti)=>(
                          <div key={ti} style={{fontSize:8,lineHeight:1.3,borderLeft:'2px solid #666',paddingLeft:3,marginBottom:1,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{t.text}</div>
                        ))}
                        {tasks.length>5 && <div style={{fontSize:8,color:'#666'}}>+{tasks.length-5}개</div>}
                      </td>
                    );
                  })}
                </tr>
              ));
            })()}
          </tbody>
        </table>
      </div>

      {/* ══════════ 인쇄 전용: CD/DVD-RW 장치 작업일지 (붙임#48 실제양식) ══════════ */}
      <div className="print-rwlog">
        <div style={{fontSize:10,color:'#555',marginBottom:4}}>붙임#48</div>
        <h1 style={{fontSize:20,textAlign:'center',fontWeight:900,textDecoration:'underline',marginBottom:10}}>CD/DVD-RW장치 작업일지</h1>
        <div style={{textAlign:'right',fontSize:13,fontWeight:700,marginBottom:10}}>관리번호 : {rwLogCd}</div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:10}}>
          <thead>
            <tr>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:32}}>연번</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:60}}>작업일자</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee'}}>자료명</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:70}}>용도</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:55}}>용량</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:60}}>자료책임자</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:50}}>매수/등급</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:55}}>작업자</th>
              <th style={{border:'1px solid #333',padding:'5px 4px',background:'#eee',width:55}}>비고</th>
            </tr>
          </thead>

            {rwLogRows.map((row,i)=>(
              <tr key={i}>

                <td style={{border:'1px solid #333',padding:'6px 4px',textAlign:'center'}}>{row.custodian}</td>
                <td style={{border:'1px solid #333',padding:'6px 4px',textAlign:'center'}}>{row.count}</td>
                <td style={{border:'1px solid #333',padding:'6px 4px',textAlign:'center'}}>{row.worker}</td>
                <td style={{border:'1px solid #333',padding:'6px 4px',textAlign:'center'}}>{row.note}</td>
              </tr>
            ))}
            {Array.from({length:Math.max(0,14-rwLogRows.length)}).map((_,i)=>(
              <tr key={'blank'+i}>
                {Array.from({length:9}).map((__,j)=><td key={j} style={{border:'1px solid #333',padding:'11px 4px'}}>&nbsp;</td>)}
              </tr>

        </table>

      {/* ══════════ 인쇄 전용: 오늘업무 체크리스트 ══════════ */}
      <div className="print-daily">
        <h1 style={{fontSize:18,borderBottom:'2px solid #000',paddingBottom:8,marginBottom:4}}>기동대 오늘업무 체크리스트</h1>
        <div style={{fontSize:12,marginBottom:14,color:'#333'}}>
          {printRange==='day' && <>{dailyKey} ({DOWS[today.getDay()]}) {todayIsWorkday?'':'— 휴무일'}</>}
          {printRange==='week' && <>{curY}년 {MONTHS[curM]} — 이번주 근무일 체크표</>}
          {printRange==='month' && <>{curY}년 {MONTHS[curM]} — 월간 근무일 체크표</>}
        </div>

        {printRange==='day' ? (
          todayIsWorkday ? [...todayExtraGroup, ...buildDailyGroups(masterTasks)].map((sec,si)=>(
            <div key={si} style={{marginBottom:14, breakInside:'avoid'}}>

              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}><tbody>
                {sec.items.map((item,j)=>{

              {(printRange==='week'?getWeekWorkdays():getMonthWorkdays()).map((dt,i)=>(

              ))}

            <tbody>
              {buildDailyGroups(masterTasks).flatMap(sec=>sec.items).map((item,ri)=>{

                  <tr key={ri}>
                    <td style={{border:'1px solid #ccc',padding:'3px 5px',textAlign:'left'}}>{item.t}</td>
                    {dates.map((dt,ci)=>(<td key={ci} style={{border:'1px solid #ccc',textAlign:'center',padding:'3px 0'}}>☐</td>))}

        {/* 남는 공간 메모란 */}
        <div style={{marginTop:20,breakInside:'avoid'}}>
          <div style={{fontSize:11,fontWeight:700,marginBottom:4,borderBottom:'1px solid #999',paddingBottom:3}}>메모</div>
          <div style={{border:'1px solid #999',height:printRange==='day'?170:110}}></div>

        padding: isMobile?'8px 10px':'0 12px', position:'sticky', top:0, zIndex:300, boxShadow:'0 4px 20px rgba(0,0,0,.7)'}}>

        {isMobile ? (

          <div>

              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:30,height:30,background:`linear-gradient(135deg,${C.gold},${C.orange})`,clipPath:'polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>⚡</div>
                <div style={{fontSize:13,fontWeight:900,color:C.tan}}>기동대 시스템</div>

              {[['cal','📅 월력'],['daily','📋 오늘업무'],['person','👥 자원'],['train','🎯 훈련'],['dday','⏱ 훈련계획'],['master','🗂 업무마스터']].map(([m,l])=>(

                  {m==='master' && unplannedTasks.length>0 && <span style={{position:'absolute',top:-4,right:-4,background:C.red2,color:'#fff',fontSize:8,fontFamily:fontMono,padding:'1px 4px',borderRadius:8}}>{unplannedTasks.length}</span>}

                <button key={m} style={{...s.tab(mode===m), position:'relative'}} onClick={()=>setMode(m)}>

              <button style={s.tab(mode==='journal'||mode==='rwlog')} onClick={()=>setMode('journal')}>🏢 부대관리</button>

                <div style={{position:'absolute',top:'100%',left:0,background:C.bg1,border:`1px solid ${C.gold}`,zIndex:200,minWidth:150}}>
                  <button onClick={()=>{setMode('journal');setShowUnitMenu(false);}} style={{display:'block',width:'100%',textAlign:'left',padding:'9px 12px',background:mode==='journal'?C.g4:'transparent',border:'none',color:C.txt,fontSize:12,cursor:'pointer'}}>📝 업무일지</button>
                  <button onClick={()=>{setMode('rwlog');setShowUnitMenu(false);}} style={{display:'block',width:'100%',textAlign:'left',padding:'9px 12px',background:mode==='rwlog'?C.g4:'transparent',border:'none',color:C.txt,fontSize:12,cursor:'pointer'}}>📀 CD 작업일지</button>
                </div>

            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'8px 10px',borderRight:`1px solid ${C.g4}`}}>
              <button onClick={exportAllData} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.txt2,padding:'5px 9px',fontSize:10,cursor:'pointer',fontFamily:fontMono}}>⬇ 전체 내보내기</button>
              <button onClick={()=>setShowCloudCfg(true)} style={{background:'transparent',border:`1px solid ${C.g5}`,color:cloudStatus==='연결됨'?C.g8:C.txt3,padding:'5px 9px',fontSize:10,cursor:'pointer',fontFamily:fontMono}}>⚙ {cloudStatus}</button>

            {mode==='cal' && (

                <button style={{background:C.bg2,border:`1px solid ${C.g5}`,color:C.txt2,width:26,height:26,cursor:'pointer',fontSize:13}} onClick={()=>{if(curM===0){setCurM(11);setCurY(y=>y-1);}else setCurM(m=>m-1);}}>◀</button>
                <div style={{textAlign:'center',minWidth:80}}>
                  <div style={{fontFamily:fontMono,fontSize:9,color:C.txt3,letterSpacing:2}}>{curY}년</div>
                  <div style={{fontSize:17,fontWeight:900,color:C.gold}}>{MONTHS[curM]}</div>
                </div>
                <button style={{background:C.bg2,border:`1px solid ${C.g5}`,color:C.txt2,width:26,height:26,cursor:'pointer',fontSize:13}} onClick={()=>{if(curM===11){setCurM(0);setCurY(y=>y+1);}else setCurM(m=>m+1);}}>▶</button>
                <button style={{background:C.g4,border:`1px solid ${C.g6}`,color:C.tan,padding:'4px 8px',fontSize:10,fontWeight:700,cursor:'pointer'}} onClick={()=>{setCurY(today.getFullYear());setCurM(today.getMonth());}}>오늘</button>
                <button onClick={()=>printSection('cal')} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.txt2,padding:'4px 8px',fontSize:10,cursor:'pointer'}}>🖨 인쇄</button>
              </div>
            )}
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',flex:1}}>
              {[[stats.tot,C.txt2,'전체'],[stats.act,C.g8,'정상'],[stats.abs,C.red2,'미참'],[stats.wrn,C.purple2,'3차⚠']].map(([v,c,l],i)=>(
                <span key={i} style={{display:'flex',alignItems:'center',gap:8}}>
                  {i>0&&<span style={{width:1,height:20,background:C.g4}}/>}
                  <span style={{display:'flex',flexDirection:'column',alignItems:'center',minWidth:32}}>
                    <span style={{fontFamily:fontMono,fontSize:14,fontWeight:700,color:c,lineHeight:1}}>{v}</span>
                    <span style={{fontSize:8,color:C.txt3,letterSpacing:1,marginTop:1}}>{l}</span>
                  </span>

            </div>
            <div style={{padding:'8px 0 8px 10px',borderLeft:`1px solid ${C.g4}`,textAlign:'right'}}>

              <div style={{fontSize:8,color:C.txt3,fontFamily:fontMono}}>{clock.split('|')[1]}</div>
            </div>
          </div>
        )}

        {/* 모바일 달력 네비 (월력 모드일 때만, 헤더 하단) */}
        {isMobile && mode==='cal' && (
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginTop:8,paddingTop:8,borderTop:`1px solid ${C.g4}`}}>
            <button style={{background:C.bg2,border:`1px solid ${C.g5}`,color:C.txt2,width:30,height:30,cursor:'pointer',fontSize:14}} onClick={()=>{if(curM===0){setCurM(11);setCurY(y=>y-1);}else setCurM(m=>m-1);}}>◀</button>
            <div style={{textAlign:'center',minWidth:90}}>
              <div style={{fontFamily:fontMono,fontSize:10,color:C.txt3,letterSpacing:2}}>{curY}년</div>
              <div style={{fontSize:18,fontWeight:900,color:C.gold}}>{MONTHS[curM]}</div>
            </div>
            <button style={{background:C.bg2,border:`1px solid ${C.g5}`,color:C.txt2,width:30,height:30,cursor:'pointer',fontSize:14}} onClick={()=>{if(curM===11){setCurM(0);setCurY(y=>y+1);}else setCurM(m=>m+1);}}>▶</button>
            <button style={{background:C.g4,border:`1px solid ${C.g6}`,color:C.tan,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}} onClick={()=>{setCurY(today.getFullYear());setCurM(today.getMonth());}}>오늘</button>
            <button onClick={()=>printSection('cal')} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.txt2,padding:'5px 9px',fontSize:11,cursor:'pointer'}}>🖨</button>
          </div>
        )}
      </div>

      {/* ══════════ 월력표 ══════════ */}
      {mode==='cal' && (
        <div style={{padding:isMobile?6:10}}>
          {/* 미계획 업무 피드백 배너 */}
          {unplannedTasks.length>0 && (
            <div onClick={()=>setMode('master')} style={{cursor:'pointer',marginBottom:8,background:'rgba(176,48,32,.14)',border:`1px solid ${C.red2}`,borderLeft:`4px solid ${C.red3}`,padding:'8px 12px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:12,fontWeight:700,color:C.red3}}>⚠ 계획 필요 업무 {unplannedTasks.length}건 — 탭하여 업무마스터에서 날짜 지정</span>
              <span style={{fontSize:10,color:C.txt3}}>▶</span>
            </div>
          )}
          {/* 달력 영역 + 업무표시 영역 — 각각 테두리·배경으로 명확히 구분된 별도 박스 (한글 구역나누기처럼) */}
          <div style={{display:'grid', gridTemplateColumns:isMobile?'1fr':'minmax(0,2.1fr) minmax(260px,1fr)', gap:14, alignItems:'start'}}>
            <div style={{minWidth:0, overflow:'hidden', background:C.bg1, border:`1px solid ${C.g4}`, padding:isMobile?8:12}}>
              <div style={{fontSize:10,fontWeight:700,color:C.gold,fontFamily:fontMono,letterSpacing:2,marginBottom:8,paddingBottom:6,borderBottom:`1px solid ${C.g4}`}}>📅 월력</div>
              {/* 요일 헤더 */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2,minWidth:0}}>
                {['일','월','화','수','목','금','토'].map((d,i)=>(
                  <div key={d} style={{textAlign:'center',fontFamily:fontMono,fontSize:isMobile?9:9,fontWeight:700,
                    color:i===0?C.red:i===6?C.blue2:C.txt3,letterSpacing:isMobile?0:2,padding:'5px 0',
                    background:C.bg1,borderBottom:`2px solid ${C.g4}`,overflow:'hidden'}}>{d}</div>
                ))}
              </div>
              {/* 달력 그리드 — 1~31일 항상 고정, 클릭해도 크기·배치 절대 안 바뀜 */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,minWidth:0}}>
                {renderCal().map((cell,i)=>{
                  const {y,m,d,other}=cell;
                  const dow=new Date(y,m,d).getDay();
                  const key=dk(y,m,d);
                  const isTd=y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
                  const isSel=key===selDate;
                  const baseTasks=other?[]:getTasks(y,m,d,custom);
                  const ddTasks=other?[]:getDdayTasksForDate(y,m,d);
                  const masterHere=other?[]:getMasterTasksForDate(y,m,d,masterTasks);
                  const masterDue=masterHere.filter(t=>!t.preview);
                  const masterPreview=masterHere.filter(t=>t.preview);
                  const tasks=[...masterDue,...baseTasks,...ddTasks,...masterPreview];
                  const maxShow = isMobile?1:4;
                  return (
                    <div key={i}
                      onClick={()=>!other&&setSelDate(k=>k===key?null:key)}
                      style={{background:C.bg1, border:`${(isTd||isSel)?2:1}px solid ${isTd?C.gold:isSel?C.g7:C.g4}`,
                        minHeight:isMobile?52:90, minWidth:0, overflow:'hidden', position:'relative', display:'flex', flexDirection:'column',
                        cursor:other?'default':'pointer', opacity:other?.5:1}}>
                      {isTd&&<div style={{position:'absolute',top:0,left:-1,right:-1,height:3,background:C.gold}}/>}
                      <div style={{fontFamily:fontMono,fontSize:isMobile?11:11,fontWeight:700,
                        color:isTd?C.gold:dow===0?C.red:dow===6?C.blue2:C.txt2,
                        padding:'3px 5px 2px',background:isTd?'rgba(200,160,64,.12)':'transparent',
                        display:'flex',justifyContent:'space-between'}}>
                        <span>{d}</span>
                        {isMobile&&tasks.length>0&&<span style={{fontSize:8,color:C.gold2,fontFamily:fontMono}}>●{tasks.length}</span>}
                      </div>
                      {/* PC만 태그 표시 (모바일은 점 개수만) — 달력 칸 크기는 항상 고정, 절대 확장 안 됨 */}
                      {!isMobile && (
                        <div style={{flex:1,minWidth:0,padding:'0 2px 4px',display:'flex',flexDirection:'column',gap:1,overflow:'hidden'}}>
                          {tasks.slice(0, maxShow).map((t,j)=>(
                            <div key={j}
                              onClick={(e)=>{e.stopPropagation();toggleCheck(key+'_'+t.text);}}
                              style={{fontSize:9, lineHeight:1.4, padding:'1px 3px', minWidth:0, maxWidth:'100%', boxSizing:'border-box',
                                borderLeft:`2px solid ${clsColor[t.cls]||C.g7}`, background:tagBg[t.cls]||tagBg.green,
                                color:clsColor[t.cls]||C.g8, overflow:'hidden', textOverflow:'ellipsis',
                                whiteSpace:isMobile?'normal':'nowrap', cursor:'pointer',
                                opacity:checks[key+'_'+t.text]?.35:1, textDecoration:checks[key+'_'+t.text]?'line-through':'none'}}>
                              {t.text}
                              {isMobile && <span style={{fontSize:9,color:C.txt3,marginLeft:6,fontFamily:fontMono}}>{t.law}</span>}
                            </div>
                          ))}
                          {!isMobile && tasks.length>4 && <div style={{fontSize:8,color:C.txt3,fontFamily:fontMono,padding:'1px 3px',textAlign:'right'}}>+{tasks.length-4}개</div>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 선택일 단일 패널 — 폰: 달력 아래 / PC: 달력 우측 고정영역. 달력과 동일한 스타일의 별도 박스로 항상 구분됨 */}
            <div style={{minWidth:0, overflow:'hidden', background:C.bg1, border:`1px solid ${C.g4}`, padding:isMobile?8:12}}>

              {!selDate ? (
                <div style={{border:`1px dashed ${C.g4}`,padding:20,textAlign:'center',color:C.txt3,fontSize:12}}>

                </div>
              ) : (
                <div style={{border:`2px solid ${C.gold}`, padding:isMobile?12:14}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div>
                      <div style={{fontSize:isMobile?15:14,fontWeight:900,color:C.gold}}>
                        {`${selDate.split('-')[0]}년 ${parseInt(selDate.split('-')[1])}월 ${parseInt(selDate.split('-')[2])}일`}

                      </div>
                    </div>
                    <button onClick={()=>setSelDate(null)} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.txt3,width:28,height:28,cursor:'pointer',fontSize:15}}>✕</button>
                  </div>

                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
                    <span style={{fontSize:10,color:C.txt3,fontFamily:fontMono}}>진행 {selDone}/{selCheckable.length}</span>
                    <div style={{flex:1,height:4,background:C.bg,border:`1px solid ${C.g4}`}}>
                      <div style={{height:'100%',background:`linear-gradient(90deg,${C.g5},${C.g8})`,width:`${selPct}%`,transition:'width .3s'}}/>
                    </div>
                    <span style={{fontFamily:fontMono,fontSize:11,color:C.gold,minWidth:30,textAlign:'right'}}>{selPct}%</span>
                  </div>

                  {selTasks.length===0
                    ? <div style={{color:C.txt3,fontSize:11,padding:'6px 0'}}>지정 업무 없음</div>
                    : <ul style={{listStyle:'none',margin:0,padding:0}}>
                        {selTasks.map((t,i)=>{
                          const tkey = t.checkKey || (selDate+'_'+t.text);
                          const isPrev = !!t.preview;
                          const hasSteps = !isPrev && !!(t.steps && t.steps.length);
                          const isNA = hasSteps && checks[tkey+'__na'];
                          const done = hasSteps ? (isNA || t.steps.every((_,si)=>checks[tkey+'__s'+si])) : checks[tkey];
                          const stepsDoneCount = hasSteps ? t.steps.filter((_,si)=>checks[tkey+'__s'+si]).length : 0;
                          const hkey = 'sel_'+i+'_'+(t.masterId||t.text);
                          const tag = PERIOD_TAG[t.period];
                          const lawText = (t.law && !GENERIC_LAW.has(t.law)) ? t.law : '';
                          const subtitle = [lawText, (hasSteps && !isNA) ? `수행절차 (${stepsDoneCount}/${t.steps.length})` : ''].filter(Boolean).join(' · ');
                          return (
                            <li key={i} style={{padding:isMobile?'8px 0':'5px 0', borderBottom:`1px solid rgba(42,69,29,.2)`, opacity:isPrev?.55:1}}>
                              <div onClick={()=>{if(isPrev)return; hasSteps?toggleHowto(hkey):toggleCheck(tkey);}} style={{display:'flex',alignItems:'flex-start',gap:8,cursor:isPrev?'default':'pointer'}}>
                                {!isPrev && <div style={{width:16,height:16,border:`1.5px solid ${done?C.g7:C.g5}`,
                                  background:isNA?C.g6:(done?C.g7:'transparent'),flexShrink:0,marginTop:1,
                                  display:'flex',alignItems:'center',justifyContent:'center'}}>
                                  {done&&<span style={{fontSize:10,color:C.bg,fontWeight:900}}>{isNA?'–':'✓'}</span>}
                                </div>}
                                {isPrev && <div style={{width:16,textAlign:'center',flexShrink:0,fontSize:11,color:t.isPrep?C.red2:C.gold2}}>{t.isPrep?'⚑':'◇'}</div>}
                                <div style={{flex:1}}>
                                  <div style={{fontSize:13,color:isPrev?(t.isPrep?C.red2:C.gold2):(done?C.txt3:C.txt),textDecoration:!isPrev&&done&&!isNA?'line-through':'none',lineHeight:1.4}}>
                                    {tag && <span style={{fontSize:8,color:clsColor[PERIOD_COLOR[t.period]]||C.txt3,fontFamily:fontMono,marginRight:4}}>[{tag}]</span>}
                                    {t.text}{isNA && <span style={{fontSize:9,color:C.txt3,marginLeft:5}}>(해당없음)</span>}
                                  </div>
                                  {subtitle && <div style={{fontSize:9,color:C.txt3,fontFamily:fontMono}}>{subtitle}</div>}
                                </div>
                                {hasSteps && <span style={{color:C.gold2,fontSize:11,flexShrink:0}}>{expandedHowto[hkey]?'▲':'▶'}</span>}
                              </div>
                              {hasSteps && expandedHowto[hkey] && (
                                <div style={{marginTop:6,marginLeft:24,background:C.bg2,border:`1px solid ${C.g4}`,borderLeft:`3px solid ${C.gold2}`,padding:'8px 10px'}}>
                                  <button onClick={()=>toggleCheck(tkey+'__na')} style={{...s.btn(isNA), fontSize:10, padding:'5px 10px', marginBottom:8, width:'100%'}}>
                                    {isNA?'✓ 해당없음 (해제)':'해당없음 처리'}
                                  </button>
                                  {!isNA && <ul style={{listStyle:'none',margin:0,padding:0}}>
                                    {t.steps.map((st,si)=>{
                                      const sk = tkey+'__s'+si;
                                      const sdone = checks[sk];
                                      return (
                                        <li key={si} onClick={()=>toggleCheck(sk)} style={{display:'flex',alignItems:'flex-start',gap:7,padding:'4px 0',cursor:'pointer'}}>
                                          <div style={{width:13,height:13,border:`1.5px solid ${sdone?C.g7:C.g5}`,background:sdone?C.g7:'transparent',flexShrink:0,marginTop:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
                                            {sdone&&<span style={{fontSize:8,color:C.bg,fontWeight:900}}>✓</span>}
                                          </div>
                                          <span style={{fontSize:11,color:sdone?C.txt3:C.txt2,textDecoration:sdone?'line-through':'none',lineHeight:1.5}}>{si+1}. {st}</span>
                                        </li>
                                      );
                                    })}
                                  </ul>}
                                </div>
                              )}
                            </li>
                          );
                        })}
                      </ul>
                  }
                </div>
              )}
            </div>
          </div>
        </div>
      )}


      {/* ══════════ 오늘업무 (일/주/월/분기/반기/연간 통합) ══════════ */}
      {mode==='daily' && (
        <div style={{padding:isMobile?10:11}}>
          <div style={{display:'flex',justifyContent:'flex-end',gap:6,marginBottom:8,alignItems:'center',flexWrap:'wrap'}}>
            <select value={printRange} onChange={e=>setPrintRange(e.target.value)} style={{...s.input,width:'auto',fontSize:11,padding:'6px 8px'}}>
              <option value="day">하루치</option>
              <option value="week">1주일치(체크표)</option>
              <option value="month">1개월치(체크표)</option>
            </select>

      {/* ══════════ 훈련관리 ══════════ */}

            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(2,1fr)',gap:6}}>
              {[
                ['병 1~4년차','동원소집대상자: 동원Ⅰ형 28H(2박3일·숙영)','동원소집미대상자: 동원Ⅱ형 32H(4일·비숙영)','공군 병(예외): 동원Ⅱ형 28H(2박3일·숙영)'],

                <span key={l}><span style={{background:c,color:'#fff',padding:'1px 3px',fontSize:9}}>{sb}</span> {l}</span>

                    <th style={{background:C.bg2,padding:'6px 7px',fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:1,fontFamily:fontMono,borderBottom:`2px solid ${C.g4}`,textAlign:'center'}}>연차</th>
                    <th style={{background:C.bg2,padding:'6px 7px',fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:1,fontFamily:fontMono,borderBottom:`2px solid ${C.g4}`,textAlign:'center'}}>차수</th>
                    {allTypes.map(t=>(
                      <th key={t} style={{background:C.bg2,padding:'6px 7px',fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:1,fontFamily:fontMono,borderBottom:`2px solid ${C.g4}`,textAlign:'center',minWidth:68}}>{t}</th>
                    ))}
                    <th style={{background:C.bg2,padding:'6px 7px',fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:1,fontFamily:fontMono,borderBottom:`2px solid ${C.g4}`,textAlign:'center'}}>진행률</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredForTrain.map(p=>{
                    const yr=parseInt(p.year)||1;
                    const pTypes=getYRT(p);
                    const logs=trainLog[p.id]||[];
                    const ord=parseInt(p.trainOrder||1);
                    const prog=calcProg(p,trainLog);
                    const bc=getBarColor(prog.pct);
                    return (
                      <tr key={p.id} onMouseEnter={e=>e.currentTarget.style.background='rgba(61,92,55,.07)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                        <td style={{padding:'5px 6px',fontWeight:700,color:C.tan,textAlign:'left'}}>{p.name}</td>
                        <td style={{padding:'5px 6px',textAlign:'center'}}><span style={{fontFamily:fontMono,fontSize:9,fontWeight:700,padding:'1px 4px',border:`1px solid ${C.g5}`,color:C.txt2}}>{yr}차</span></td>
                        <td style={{padding:'5px 6px',textAlign:'center'}}>
                          <span style={{fontSize:9,fontFamily:fontMono,padding:'1px 4px',background:ord>=3?'rgba(176,48,32,.2)':ord===2?'rgba(192,112,40,.15)':'rgba(74,122,72,.15)',color:ord>=3?C.red2:ord===2?C.orange2:C.g8,border:`1px solid ${ord>=3?C.red:ord===2?C.orange:C.g6}`}}>{ord}차{ord>=3?'⚠':''}</span>
                        </td>

                          const log=logs.find(l=>l.type===col);
                          const clsMap={참가:'at',미참:'ab',보류:'ho',연기:'de',고발:'go'};

                          const lbMap={at:'✓',ab:'✗',ho:'보',de:'연',go:'고'};
                          return (
                            <td key={col} style={{padding:'5px 6px',textAlign:'center',cursor:'pointer'}} onClick={()=>openTC(p.id, col)}>
                              <div style={{width:19,height:19,border:`1.5px solid ${cls?bgMap[cls]:C.g5}`,background:cls?bgMap[cls]:'transparent',margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'center'}}>
                                {cls&&<span style={{fontSize:cls==='at'||cls==='ab'?9:7,color:cls==='at'?C.bg:'#fff',fontWeight:900}}>{lbMap[cls]}</span>}
                              </div>
                            </td>

                            <span style={{fontFamily:fontMono,fontSize:8,color:bc}}>{prog.pct}%</span>
                          </div>

                      </tr>

            </div>
          )}
        </div>
      )}

              <select value={ddType} onChange={e=>setDdType(e.target.value)} style={{...s.input,flex:isMobile?'1 1 auto':'none',width:isMobile?'auto':150}}>
                <option value="동원Ⅱ형">동원훈련Ⅱ형</option>

                <option value="2">2차</option>
                <option value="3">3차</option>
              </select>
              <input value={ddName} onChange={e=>setDdName(e.target.value)} placeholder="훈련이름 (선택, 직접입력)"
                style={{...s.input,flex:isMobile?'1 1 100%':'1 1 160px'}}/>
              <button onClick={calcDD} style={{...s.btn(false),flex:isMobile?'1 1 auto':'none'}}>📅 계산</button>
              <button onClick={saveDdayToCalendar} style={{...s.btn(true),flex:isMobile?'1 1 auto':'none'}}>{ddEditDate?'💾 수정 저장':'📌 월력표 추가'}</button>
              {ddEditDate && <button onClick={cancelDdEdit} style={{...s.btn(false),flex:isMobile?'1 1 auto':'none'}}>취소</button>}
            </div>
          </div>

          {ddTrains.length>0 && (
            <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderLeft:`4px solid ${C.gold}`,padding:'10px 13px',marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:700,color:C.gold,fontFamily:fontMono,letterSpacing:1,marginBottom:7}}>📌 월력표 등록 훈련 ({ddTrains.length}개)</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {ddTrains.map((t,i)=>(
                  <div key={i} style={{background:ddEditDate===t.trainDate?C.bg:C.bg2,border:`1px solid ${ddEditDate===t.trainDate?C.gold:C.g5}`,padding:'5px 10px',display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:11,color:C.gold2,fontFamily:fontMono}}>{t.trainDate}</span>
                    <span style={{fontSize:11,color:C.txt2}}>{t.trainOrder||1}차 {t.trainType}{t.trainName?' · '+t.trainName:''}</span>
                    <button onClick={()=>openCheckinItemsModal(t)} disabled={qrBusy} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.blue3,fontSize:10,padding:'2px 6px',cursor:'pointer'}}>📱 QR</button>
                    <button onClick={()=>openCheckinStatus(t)} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.g8,fontSize:10,padding:'2px 6px',cursor:'pointer'}}>📊 현황</button>
                    <button onClick={()=>editDdTrain(t)} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.gold2,fontSize:10,padding:'2px 6px',cursor:'pointer'}}>✏ 수정</button>
                    <button onClick={()=>delDdTrain(t.trainDate)} style={{background:'transparent',border:`1px solid ${C.red}`,color:C.red2,fontSize:10,padding:'2px 6px',cursor:'pointer'}}>삭제</button>

            <div>

                const isPast=step.diff<0, isTd=step.diff===0, isSoon=step.diff>=0&&step.diff<=3;

                      {step.law && !GENERIC_LAW.has(step.law) && <div style={{fontSize:8,color:C.txt3,fontFamily:fontMono,marginTop:2}}>📖 {step.law}</div>}
                    </div>
                    <span style={{fontSize:9,fontFamily:fontMono,padding:'2px 6px',
                      alignSelf:'center',marginRight:8,
                      background:isPast?'rgba(74,122,72,.15)':isTd?'rgba(200,160,64,.15)':isSoon?'rgba(176,48,32,.15)':'rgba(42,69,29,.2)',
                      color:statusColor,border:`1px solid ${statusColor}`}}>
                      {statusLabel}
                    </span>
                  </div>
                );
              })}
            </div>
          )}

          {/* 훈련계획 절차 직접 관리 (업무마스터처럼 추가·수정·삭제) */}
          <div style={{marginTop:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
              <div style={{fontSize:12,fontWeight:900,color:C.tan}}>📋 통보·발송 절차 목록 ({ddSteps.length}개)</div>
              <span style={{fontSize:10,color:C.txt3}}>내가 하는 일 / 대대가 하는 일 / 사단이 하는 일을 직접 나눠서 관리하세요</span>
              <button onClick={()=>openDdStep()} style={{...s.btn(true),marginLeft:isMobile?0:'auto',width:isMobile?'100%':'auto'}}>+ 절차 추가</button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:5}}>
              {ddSteps.map(s=>(
                <div key={s.id} style={{background:C.bg1,border:`1px solid ${C.g4}`,borderLeft:`4px solid ${clsColor[s.cls]||C.g6}`,padding:'7px 10px',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span style={{fontSize:10,color:C.gold2,fontFamily:fontMono,minWidth:36}}>{s.d===0?'D-day':s.d>0?'D+'+s.d:'D'+s.d}</span>
                  <div style={{flex:1,minWidth:120}}>
                    <div style={{fontSize:12,color:C.tan}}>{s.name}</div>
                    {s.law && !GENERIC_LAW.has(s.law) && <div style={{fontSize:9,color:C.txt3,fontFamily:fontMono}}>{s.law}</div>}
                  </div>
                  <span style={{fontSize:9,fontFamily:fontMono,padding:'2px 6px',border:`1px solid ${clsColor[OWNER_COLOR[s.owner]]||C.g5}`,color:clsColor[OWNER_COLOR[s.owner]]||C.txt3}}>{s.owner||'나'}</span>
                  <button onClick={()=>openDdStep(s.id)} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.gold2,fontSize:10,padding:'4px 8px',cursor:'pointer'}}>✏ 수정</button>
                  <button onClick={()=>delDdStep(s.id)} style={{background:'transparent',border:`1px solid ${C.red}`,color:C.red2,fontSize:10,padding:'4px 8px',cursor:'pointer'}}>삭제</button>
                </div>
              ))}
              {ddSteps.length===0 && <div style={{textAlign:'center',padding:24,color:C.txt3,fontSize:12}}>등록된 절차가 없습니다</div>}
            </div>
          </div>
        </div>
      )}

      {/* ══════════ 업무 마스터 목록 ══════════ */}
      {mode==='master' && (
        <div style={{padding:isMobile?10:11}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <h2 style={{fontSize:15,fontWeight:900,color:C.tan,margin:0}}>업무 마스터 목록</h2>
            <span style={{fontSize:10,color:C.txt3}}>전체 업무를 직접 추가·수정·삭제·주기설정 하세요</span>
            <div style={{display:'flex',gap:6,marginLeft:isMobile?0:'auto',width:isMobile?'100%':'auto'}}>
              <button onClick={exportAllData} style={{...s.btn(false),flex:isMobile?1:'none'}}>⬇ 전체 내보내기</button>
              <button onClick={()=>openMT()} style={{...s.btn(true),flex:isMobile?1:'none'}}>+ 업무 추가</button>
            </div>
          </div>

          {unplannedTasks.length>0 && (
            <div style={{background:'rgba(176,48,32,.1)',border:`1px solid ${C.red2}`,borderLeft:`4px solid ${C.red3}`,padding:'9px 12px',marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:700,color:C.red3}}>⚠ 날짜 지정이 필요한 업무 {unplannedTasks.length}건 — 아래 목록에서 "미계획" 표시를 확인하세요</div>
            </div>
          )}

          <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderLeft:`4px solid ${C.gold}`,padding:'10px 13px',marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,color:C.gold,marginBottom:6,fontFamily:fontMono,letterSpacing:1}}>📅 임시공휴일·특별휴무 지정 (음력 공휴일·임시공휴일 등)</div>
            <div style={{fontSize:9,color:C.txt3,marginBottom:8,lineHeight:1.5}}>여기 등록한 날짜는 토·일요일과 동일하게 취급되어 일일업무가 표시되지 않고, 순기업무는 전날로 자동 이동합니다.</div>
            <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
              <input type="date" value={newHoliday} onChange={e=>setNewHoliday(e.target.value)} style={{...s.input,width:160}}/>
              <button onClick={addHoliday} style={s.btn(true)}>+ 추가</button>
            </div>
            {holidaysExtra.length===0
              ? <div style={{fontSize:10,color:C.txt3}}>등록된 임시휴일 없음</div>
              : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {holidaysExtra.map(d=>(
                    <div key={d} style={{display:'flex',alignItems:'center',gap:6,background:C.bg2,border:`1px solid ${C.g4}`,padding:'4px 8px',fontSize:11,color:C.txt}}>
                      {d}
                      <button onClick={()=>delHoliday(d)} style={{background:'transparent',border:'none',color:C.txt3,cursor:'pointer',fontSize:12}}>✕</button>
                    </div>
                  ))}
                </div>
            }
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {getSortedMasterTasks(masterTasks).map((t,idx,arr)=>{
              const isUnplanned = t.needsPlanning && (!t.assignedDate || t.assignedDate < dailyKey);
              const isFirst = idx===0, isLast = idx===arr.length-1;
              const tag = PERIOD_TAG[t.period];
              return (
                <div key={t.id} style={{background:C.bg1,border:`1px solid ${C.g4}`,borderLeft:`4px solid ${isUnplanned?C.red3:(clsColor[t.cls]||C.g7)}`,padding:'9px 12px',opacity:t.active?1:.45,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <button onClick={()=>moveMT(t.id,-1)} disabled={isFirst} style={{background:'transparent',border:`1px solid ${C.g5}`,color:isFirst?C.g5:C.txt2,padding:'1px 6px',fontSize:9,cursor:isFirst?'default':'pointer'}}>▲</button>
                    <button onClick={()=>moveMT(t.id,1)} disabled={isLast} style={{background:'transparent',border:`1px solid ${C.g5}`,color:isLast?C.g5:C.txt2,padding:'1px 6px',fontSize:9,cursor:isLast?'default':'pointer'}}>▼</button>
                  </div>
                  <div style={{flex:1,minWidth:160}}>
                    <div style={{fontSize:13,fontWeight:700,color:C.tan}}>
                      {tag && <span style={{fontSize:8,color:clsColor[PERIOD_COLOR[t.period]]||C.txt3,fontFamily:fontMono,marginRight:4}}>[{tag}]</span>}
                      {t.text}{isUnplanned && <span style={{marginLeft:6,fontSize:9,color:C.red3,fontFamily:fontMono}}>[미계획]</span>}
                    </div>
                    <div style={{fontSize:9,color:C.txt3,fontFamily:fontMono,marginTop:2}}>{mtScheduleText(t)}{t.law && ` · ${t.law}`}</div>
                  </div>
                  <button onClick={()=>toggleMTActive(t.id)} style={{...s.btn(false),fontSize:9,padding:'5px 8px'}}>{t.active?'사용중':'중지됨'}</button>
                  <button onClick={()=>openMT(t.id)} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.txt3,padding:'5px 8px',fontSize:11,cursor:'pointer'}}>✏</button>
                  <button onClick={()=>delMT(t.id)} style={{background:'transparent',border:`1px solid ${C.g5}`,color:C.txt3,padding:'5px 8px',fontSize:11,cursor:'pointer'}}>✕</button>
                </div>
              );
            })}
            {masterTasks.length===0 && <div style={{textAlign:'center',padding:40,color:C.txt3}}>등록된 업무가 없습니다</div>}
          </div>
        </div>
      )}

      {/* ══════════ 일일업무일지 ══════════ */}
      {mode==='journal' && (
        <div style={{padding:isMobile?10:11}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <h2 style={{fontSize:15,fontWeight:900,color:C.tan,margin:0}}>일일업무일지 (자동 생성)</h2>
            <button onClick={()=>setJournalText(buildJournal())} style={{...s.btn(true),marginLeft:isMobile?0:'auto',width:isMobile?'100%':'auto'}}>🔄 일지 생성</button>
          </div>
          <div style={{fontSize:10,color:C.txt3,marginBottom:8}}>당일 체크한 일일업무·D-day 해당업무·메모·명일 예정업무를 기준으로 초안을 만듭니다. 생성 후 국동체에 그대로 붙여넣으세요.</div>
          <textarea value={journalText} onChange={e=>setJournalText(e.target.value)} placeholder="상단 '일지 생성' 버튼을 눌러 초안을 만드세요."
            style={{width:'100%',minHeight:isMobile?300:420,background:C.bg1,border:`1px solid ${C.g4}`,color:C.txt,
              fontFamily:fontMono,fontSize:12,padding:12,resize:'vertical',outline:'none',lineHeight:1.7}}/>
          <div style={{display:'flex',gap:8,marginTop:8}}>
            <button onClick={()=>{ if(!journalText){alert('먼저 일지를 생성하세요.');return;} navigator.clipboard?.writeText(journalText).then(()=>alert('클립보드에 복사됐습니다. 국동체에 붙여넣으세요.')); }} style={{...s.btn(false),flex:1}}>📋 클립보드 복사</button>
            <button onClick={()=>{ if(!journalText)return; const nj={...load(K.JN)}; nj[dailyKey]=journalText; save(K.JN,nj); alert('일지가 저장됐습니다.'); }} style={{...s.btn(false),flex:1}}>💾 보관</button>
          </div>
        </div>
      )}

      {/* ══════════ CD/DVD-RW 장치 작업일지 (부대관리 하위메뉴) ══════════ */}
      {mode==='rwlog' && (
        <div style={{padding:isMobile?10:11}}>
          <h2 style={{fontSize:15,fontWeight:900,color:C.tan,margin:'0 0 4px'}}>📀 CD/DVD-RW 장치 작업일지 (붙임#48)</h2>
          <div style={{fontSize:10,color:C.txt3,marginBottom:12}}>관리번호(CD 1장)당 작업이력이 연번으로 계속 쌓입니다. 입력 후 인쇄하면 서명만 하면 됩니다.</div>

          <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'flex-end',flexWrap:'wrap'}}>
            <div style={{display:'flex',flexDirection:'column',gap:3,flex:1,minWidth:160}}>
              <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>관리번호 (예: 번개A-수서-1-040)</label>
              <input value={rwLogCd} onChange={e=>selectRwCd(e.target.value)} placeholder="CD 관리번호 입력" style={s.input}/>
            </div>
            <button onClick={()=>printSection('rwlog')} style={{...s.btn(true)}}>🖨 인쇄</button>
          </div>

          {!rwLogCd.trim() ? (
            <div style={{textAlign:'center',color:C.txt3,padding:30,border:`1px dashed ${C.g4}`}}>관리번호를 입력하면 그 CD의 작업이력이 표시됩니다</div>
          ) : (
            <>
              <div style={{overflowX:'auto',marginBottom:14}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,minWidth:isMobile?700:'auto'}}>
                  <thead>
                    <tr>
                      {['연번','작업일자','자료명','용도','용량','자료책임자','매수/등급','작업자','비고',''].map(h=>(
                        <th key={h} style={{border:`1px solid ${C.g4}`,padding:'6px 5px',background:C.bg2,color:C.txt2,whiteSpace:'nowrap'}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rwLogRows.map(row=>(
                      <tr key={row.seq}>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px',textAlign:'center'}}>{row.seq}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px',textAlign:'center',whiteSpace:'nowrap'}}>{row.date}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}>{row.dataName}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}>{row.purpose}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}>{row.size}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}>{row.custodian}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}>{row.count}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}>{row.worker}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}>{row.note}</td>
                        <td style={{border:`1px solid ${C.g4}`,padding:'6px 5px'}}><button onClick={()=>delRwLogRow(row.seq)} style={{background:'transparent',border:'none',color:C.txt3,cursor:'pointer'}}>✕</button></td>
                      </tr>
                    ))}
                    {rwLogRows.length===0 && <tr><td colSpan={10} style={{textAlign:'center',color:C.txt3,padding:14}}>아직 기록된 작업이 없습니다</td></tr>}
                  </tbody>
                </table>
              </div>

              <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderLeft:`4px solid ${C.gold}`,padding:'10px 12px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,flexWrap:'wrap',gap:6}}>
                  <div style={{fontSize:11,fontWeight:700,color:C.gold}}>+ 새 작업 기록 추가 (연번 {rwLogRows.length?Math.max(...rwLogRows.map(r=>r.seq))+1:1} 예정)</div>
                  <div style={{display:'flex',gap:6}}>
                    <label style={{...s.btn(true),fontSize:9,padding:'4px 8px',cursor:'pointer',display:'inline-block'}}>
                      📁 파일 선택해서 자동입력
                      <input type="file" multiple onChange={e=>{handleRwFilesSelected(e.target.files); e.target.value='';}} style={{display:'none'}}/>
                    </label>
                    <button onClick={quickFillBackup} style={{...s.btn(false),fontSize:9,padding:'4px 8px'}}>⚡ 백업 항목 자동채움</button>
                  </div>
                </div>
                <div style={{fontSize:9,color:C.txt3,marginBottom:8}}>파일 선택하면 자료명·용량·비고(파일형식)가 자동으로 채워져서 바로 목록에 추가됩니다 (여러 개 한번에 가능, 용도=백업·자료책임자=기동대장 기본값). 작업자 이름은 아래 칸에 먼저 입력해두면 같이 반영됩니다.</div>
                <div style={{display:'flex',flexDirection:'column',gap:2,marginBottom:8,maxWidth:220}}>
                  <label style={{fontSize:9,color:C.txt3}}>작업자 (파일 자동추가시 같이 적용됨)</label>
                  <input value={rwNewRow.worker} onChange={e=>setRwNewRow(f=>({...f,worker:e.target.value}))} placeholder="예: 이병 ○○○" style={{...s.input,padding:'6px 7px'}}/>
                </div>
                <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(4,1fr)',gap:8,marginBottom:8}}>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <label style={{fontSize:9,color:C.txt3}}>작업일자</label>
                    <input type="date" value={rwNewRow.date} onChange={e=>setRwNewRow(f=>({...f,date:e.target.value}))} style={{...s.input,padding:'6px 7px'}}/>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <label style={{fontSize:9,color:C.txt3}}>용도</label>
                    <input value={rwNewRow.purpose} onChange={e=>setRwNewRow(f=>({...f,purpose:e.target.value}))} placeholder="예: 노트북·행정PC 보안업데이트" style={{...s.input,padding:'6px 7px'}}/>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <label style={{fontSize:9,color:C.txt3}}>용량</label>
                    <input value={rwNewRow.size} onChange={e=>setRwNewRow(f=>({...f,size:e.target.value}))} placeholder="예: 241,486KB" style={{...s.input,padding:'6px 7px'}}/>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <label style={{fontSize:9,color:C.txt3}}>자료책임자</label>
                    <input value={rwNewRow.custodian} onChange={e=>setRwNewRow(f=>({...f,custodian:e.target.value}))} placeholder="예: 5급 ○○○" style={{...s.input,padding:'6px 7px'}}/>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <label style={{fontSize:9,color:C.txt3}}>매수/등급</label>
                    <input value={rwNewRow.count} onChange={e=>setRwNewRow(f=>({...f,count:e.target.value}))} placeholder="예: 1/평문" style={{...s.input,padding:'6px 7px'}}/>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <label style={{fontSize:9,color:C.txt3}}>비고</label>
                    <input value={rwNewRow.note} onChange={e=>setRwNewRow(f=>({...f,note:e.target.value}))} placeholder="예: 11.15.삭제" style={{...s.input,padding:'6px 7px'}}/>
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:2,marginBottom:8}}>
                  <label style={{fontSize:9,color:C.txt3}}>자료명</label>
                  <textarea value={rwNewRow.dataName} onChange={e=>setRwNewRow(f=>({...f,dataName:e.target.value}))} placeholder="예: vis2012471243.exe 또는 비상연락대상자, 편성카드..."
                    style={{width:'100%',background:C.bg2,border:`1px solid ${C.g4}`,color:C.txt,fontFamily:fontMono,fontSize:11,padding:8,resize:'vertical',minHeight:44,outline:'none',lineHeight:1.6,boxSizing:'border-box'}}/>
                </div>
                <button onClick={addRwLogRow} style={{...s.btn(true),width:'100%'}}>+ 추가</button>
              </div>
            </>
          )}
        </div>
      )}

      {/* ══════════ 대원 모달 ══════════ */}
      {showPM && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:500,display:'flex',alignItems:isMobile?'flex-end':'center',justifyContent:'center'}}>
          <div style={{background:C.bg1,border:`1px solid ${C.g4}`,borderTop:`3px solid ${C.gold}`,
            width:isMobile?'100%':560,maxWidth:'96vw',maxHeight:isMobile?'90vh':'92vh',overflowY:'auto'}}>
            <div style={{background:C.bg2,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${C.g4}`,position:'sticky',top:0,zIndex:10}}>
              <div style={{fontSize:14,fontWeight:900,color:C.gold}}>{editId?'대원 수정':'대원 등록'}</div>
              <button onClick={()=>setShowPM(false)} style={{background:'transparent',border:'none',color:C.txt3,fontSize:20,cursor:'pointer'}}>✕</button>
            </div>
            <div style={{padding:14}}>
              <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:9}}>
                <div style={{gridColumn:'1/-1',fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono,paddingBottom:2,borderBottom:`1px solid ${C.g4}`,marginBottom:2}}>■ 기본 정보</div>
                {[['이름 *','name','text','홍길동'],['연락처 *','phone','text','010-0000-0000'],['비상연락처','phone2','text','보호자'],['복무기간','svc','text','예: 2021.01~2022.12']].map(([l,k,t,ph])=>(
                  <div key={k} style={{display:'flex',flexDirection:'column',gap:3}}>
                    <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>{l}</label>
                    <input type={t} value={form[k]||''} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} placeholder={ph} style={s.input}/>
                  </div>
                ))}
                <div style={{display:'flex',flexDirection:'column',gap:3}}>
                  <label style={{fontSize:9,fontWeight:700,color:C.txt3,letterSpacing:2,fontFamily:fontMono}}>연차 *</label>
